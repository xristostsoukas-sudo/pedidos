  :root {
    --primary: #1a3a5c;
    --primary-light: #2563ab;
    --success: #2e7d32;
    --danger: #c62828;
    --warning: #f57f17;
    --bg: #f0f4f8;
    --card: #ffffff;
    --border: #dde3ea;
    --text: #1a202c;
    --text-muted: #6b7280;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
  .header { background: var(--primary); color: white; padding: 14px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 8px rgba(0,0,0,.25); }
  .header h1 { font-size: 18px; font-weight: 700; flex: 1; }
  .header-subtitle { font-size: 12px; opacity: .75; }
  .nav { display: flex; background: white; border-bottom: 1px solid var(--border); overflow-x: auto; }
  .nav-btn { flex: 1; min-width: 90px; padding: 12px 8px; border: none; background: none; cursor: pointer; font-size: 12px; font-weight: 600; color: var(--text-muted); border-bottom: 3px solid transparent; transition: all .2s; white-space: nowrap; }
  .nav-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
  .page { display: none; padding: 16px; max-width: 900px; margin: 0 auto; }
  .page.active { display: block; }
  .card { background: var(--card); border-radius: 12px; border: 1px solid var(--border); margin-bottom: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.06); }
  .card-header { padding: 14px 16px; border-bottom: 1px solid var(--border); font-weight: 700; font-size: 14px; color: var(--primary); background: #f8fafc; }
  .card-body { padding: 16px; }
  .summary-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
  .summary-card { background: white; border-radius: 10px; padding: 14px 12px; text-align: center; border: 1px solid var(--border); }
  .summary-card .label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; margin-bottom: 4px; }
  .summary-card .value { font-size: 20px; font-weight: 800; }
  .summary-card.green .value { color: var(--success); }
  .summary-card.red .value { color: var(--danger); }
  .summary-card.blue .value { color: var(--primary); }
  .form-group { margin-bottom: 14px; }
  label { display: block; font-size: 13px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }
  input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; background: white; color: var(--text); outline: none; transition: border .2s; }
  input:focus, select:focus, textarea:focus { border-color: var(--primary-light); box-shadow: 0 0 0 3px rgba(37,99,171,.1); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 18px; border-radius: 8px; border: none; font-size: 14px; font-weight: 600; cursor: pointer; transition: all .2s; }
  .btn-primary { background: var(--primary); color: white; width: 100%; padding: 13px; font-size: 15px; }
  .btn-primary:hover { background: var(--primary-light); }
  .btn-success { background: var(--success); color: white; }
  .btn-danger { background: var(--danger); color: white; }
  .btn-outline { background: white; color: var(--primary); border: 1px solid var(--primary); }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .pedido-item { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 12px; cursor: pointer; }
  .pedido-item:hover { background: #f8fafc; }
  .pedido-item:last-child { border-bottom: none; }
  .pedido-num { font-size: 12px; color: var(--text-muted); font-weight: 600; min-width: 50px; }
  .pedido-info { flex: 1; min-width: 0; }
  .pedido-cliente { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .pedido-meta { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .pedido-valor { font-size: 14px; font-weight: 800; color: var(--primary); white-space: nowrap; }
  .badge { display: inline-block; padding: 3px 8px; border-radius: 20px; font-size: 11px; font-weight: 700; }
  .badge-success { background: #e8f5e9; color: var(--success); }
  .badge-danger { background: #ffebee; color: var(--danger); }
  .badge-warning { background: #fff8e1; color: var(--warning); }
  .itens-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .itens-table th { background: #f8fafc; padding: 8px 10px; text-align: left; font-size: 11px; font-weight: 700; color: var(--text-muted); border-bottom: 1px solid var(--border); }
  .itens-table td { padding: 8px 10px; border-bottom: 1px solid var(--border); }
  .itens-table tr:last-child td { border-bottom: none; }
  .relatorio-controls { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-bottom: 16px; }
  .relatorio-controls .form-group { margin: 0; flex: 1; min-width: 120px; }
  .loading { text-align: center; padding: 40px; color: var(--text-muted); }
  .spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-muted); }
  .empty-icon { font-size: 48px; margin-bottom: 10px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #333; color: white; padding: 12px 20px; border-radius: 8px; font-size: 14px; z-index: 999; opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 200; align-items: flex-end; }
  .modal-overlay.show { display: flex; }
  .modal { background: white; width: 100%; max-height: 85vh; border-radius: 20px 20px 0 0; overflow-y: auto; padding: 20px; }
  .modal-title { font-size: 17px; font-weight: 800; margin-bottom: 16px; color: var(--primary); }
  .modal-actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .produto-result { padding: 10px 12px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
  .produto-result:hover { background: #f0f4f8; }
  .produto-result .nome { font-size: 13px; font-weight: 600; }
  .produto-result .preco { font-size: 12px; color: var(--text-muted); }
  .total-box { background: #f0f4f8; border-radius: 8px; padding: 12px 16px; margin-top: 12px; }
  .total-box .row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 4px; }
  .total-box .row.total { font-weight: 800; font-size: 15px; color: var(--primary); border-top: 1px solid var(--border); padding-top: 6px; margin-top: 4px; }
  @media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } .summary-card .value { font-size: 16px; } }
</style>
</head>
<body>
<div class="header">
  <div>
    <h1>📦 Pedidos</h1>
    <div class="header-subtitle">Sistema de vendas</div>
  </div>
</div>
<nav class="nav">
  <button class="nav-btn active" onclick="showPage('home')">🏠 Início</button>
  <button class="nav-btn" onclick="showPage('novo')">➕ Novo</button>
  <button class="nav-btn" onclick="showPage('pendentes')">⏳ Pendentes</button>
  <button class="nav-btn" onclick="showPage('relatorio')">📊 Relatório</button>
</nav>

<div class="page active" id="page-home">
  <div class="summary-grid">
    <div class="summary-card blue"><div class="label">Total</div><div class="value" id="statTotal">—</div></div>
    <div class="summary-card green"><div class="label">Aprovados</div><div class="value" id="statAprov">—</div></div>
    <div class="summary-card red"><div class="label">Cancelados</div><div class="value" id="statCanc">—</div></div>
  </div>
  <div class="card">
    <div class="card-header">📋 Últimos Pedidos</div>
    <div id="listRecentes"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
  </div>
</div>

<div class="page" id="page-novo">
  <div class="card">
    <div class="card-header">➕ Novo Pedido</div>
    <div class="card-body">
      <div class="form-group"><label>Cliente *</label><select id="selectCliente"><option value="">Carregando...</option></select></div>
      <div class="form-row">
        <div class="form-group"><label>Data de Emissão *</label><input type="date" id="dataEmissao"></div>
        <div class="form-group"><label>Condição de Pagamento</label><input type="text" id="condPagamento" placeholder="Ex: 28, 28/42"></div>
      </div>
      <div class="form-group"><label>Desconto (%)</label><input type="number" id="desconto" value="0" min="0" max="100" step="0.5"></div>
      <div class="form-group"><label>Observações</label><textarea id="observacoes" rows="2" placeholder="Observações..."></textarea></div>
    </div>
  </div>
  <div class="card">
    <div class="card-header">🛒 Itens</div>
    <div class="card-body">
      <div class="form-group"><label>Buscar Produto</label><input type="text" id="buscaProduto" placeholder="Código ou descrição..." oninput="buscarProdutos(this.value)"></div>
      <div id="resultadosProdutos"></div>
      <div id="itensSelecionados"></div>
      <div class="total-box" id="totalBox" style="display:none">
        <div class="row"><span>Subtotal sem ST:</span><span id="subtotalSemST">R$ 0,00</span></div>
        <div class="row"><span>Subtotal com ST:</span><span id="subtotalComST">R$ 0,00</span></div>
        <div class="row total"><span>TOTAL COM ST:</span><span id="totalFinal">R$ 0,00</span></div>
      </div>
    </div>
  </div>
  <button class="btn btn-primary" onclick="salvarPedido()" id="btnSalvar">💾 Salvar Pedido</button>
</div>

<div class="page" id="page-pendentes">
  <div class="card">
    <div class="card-header">⏳ Pedidos Pendentes</div>
    <div id="listPendentes"><div class="loading"><div class="spinner"></div>Carregando...</div></div>
  </div>
</div>

<div class="page" id="page-relatorio">
  <div class="card">
    <div class="card-header">📊 Fechamento Mensal</div>
    <div class="card-body">
      <div class="relatorio-controls">
        <div class="form-group"><label>Mês</label>
          <select id="selMes">
            <option value="1">Janeiro</option><option value="2">Fevereiro</option><option value="3">Março</option>
            <option value="4">Abril</option><option value="5">Maio</option><option value="6">Junho</option>
            <option value="7">Julho</option><option value="8">Agosto</option><option value="9">Setembro</option>
            <option value="10">Outubro</option><option value="11">Novembro</option><option value="12">Dezembro</option>
          </select>
        </div>
        <div class="form-group"><label>Ano</label><input type="number" id="selAno" value="2026" min="2020" max="2099"></div>
        <button class="btn btn-primary" style="flex:none;width:auto;padding:10px 20px" onclick="gerarRelatorio()">🔍 Gerar</button>
      </div>
      <div id="relatorioResultado"></div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modalDetalhes">
  <div class="modal">
    <div class="modal-title" id="modalTitulo">Detalhes do Pedido</div>
    <div id="modalConteudo"></div>
    <div class="modal-actions" id="modalAcoes"></div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>

  const opts={method,headers:{'Authorization':'Bearer '+SB_KEY,'apikey':SB_KEY,'Content-Type':'application/json','Accept':'application/json','Prefer':method==='POST'?'return=representation':''}};
  if(body)opts.body=JSON.stringify(body);
  const r=await fetch(SB_URL+'/rest/v1/'+path,opts);
  if(!r.ok){const e=await r.json();throw new Error(e.message||'Erro na API');}
  return method==='DELETE'?null:r.json();
}
function fmtBRL(v){return 'R$ '+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});}
function fmtDate(d){if(!d)return'-';const[y,m,dd]=d.split('-');return dd+'/'+m+'/'+y;}
function statusBadge(s){const map={APROVADO:'badge-success',CANCELADO:'badge-danger',PENDENTE:'badge-warning'};return '<span class="badge '+(map[s]||'')+'">'+s+'</span>';}
function ultimoDiaMes(ano,mes){return new Date(ano,mes,0).getDate();}
function toast(msg,err=false){const t=document.getElementById('toast');t.textContent=msg;t.style.background=err?'#c62828':'#1a3a5c';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),3000);}

function showPage(p){
  document.querySelectorAll('.page').forEach(e=>e.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(e=>e.classList.remove('active'));
  document.getElementById('page-'+p).classList.add('active');
  document.querySelectorAll('.nav-btn')[['home','novo','pendentes','relatorio'].indexOf(p)]?.classList.add('active');
  currentPage=p;
  if(p==='home')loadHome();
  if(p==='pendentes')loadPendentes();
  if(p==='novo')initNovo();
}

async function loadHome(){
  try{
    const pedidos=await api('pedidos?select=id,numero_pedido,cliente_id,data_emissao,total_com_st,status,condicao_pagamento&order=created_at.desc&limit=20');
    const ids=[...new Set(pedidos.map(p=>p.cliente_id))].filter(Boolean);
    let cMap={};
    if(ids.length){const cs=await api('clientes?id=in.('+ids.join(',')+')'+'&select=id,razao_social');cs.forEach(c=>cMap[c.id]=c.razao_social);}
    document.getElementById('statTotal').textContent=pedidos.length;
    document.getElementById('statAprov').textContent=pedidos.filter(p=>p.status==='APROVADO').length;
    document.getElementById('statCanc').textContent=pedidos.filter(p=>p.status==='CANCELADO').length;
    if(!pedidos.length){document.getElementById('listRecentes').innerHTML='<div class="empty"><div class="empty-icon">📭</div>Nenhum pedido</div>';return;}
    document.getElementById('listRecentes').innerHTML=pedidos.map(p=>'<div class="pedido-item" onclick="verPedido(\''+p.id+'\')">'+'<div class="pedido-num">'+(p.numero_pedido||'#')+'</div>'+'<div class="pedido-info"><div class="pedido-cliente">'+(cMap[p.cliente_id]||'—')+'</div>'+'<div class="pedido-meta">'+fmtDate(p.data_emissao)+' · '+(p.condicao_pagamento||'-')+' · '+statusBadge(p.status)+'</div></div>'+'<div class="pedido-valor">'+fmtBRL(p.total_com_st)+'</div></div>').join('');
  }catch(e){document.getElementById('listRecentes').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div>'+e.message+'</div>';}
}

async function verPedido(id){
  const modal=document.getElementById('modalDetalhes');
  document.getElementById('modalConteudo').innerHTML='<div class="loading"><div class="spinner"></div></div>';
  document.getElementById('modalAcoes').innerHTML='';
  modal.classList.add('show');
  try{
    const [p]=await api('pedidos?id=eq.'+id+'&select=*');
    const [c]=await api('clientes?id=eq.'+p.cliente_id+'&select=razao_social');
    const itensP=await api('itens_pedido?pedido_id=eq.'+id+'&select=*,produtos(codigo,descricao)');
    document.getElementById('modalTitulo').textContent='Pedido '+(p.numero_pedido||'s/n');
    document.getElementById('modalConteudo').innerHTML='<p><b>Cliente:</b> '+(c?.razao_social||'—')+'</p><p><b>Data:</b> '+fmtDate(p.data_emissao)+' &nbsp;|&nbsp; <b>Cond.:</b> '+(p.condicao_pagamento||'-')+'</p><p><b>Status:</b> '+statusBadge(p.status)+'</p>'+(p.observacoes?'<p><b>Obs:</b> '+p.observacoes+'</p>':'')+'<br><table class="itens-table"><thead><tr><th>Produto</th><th>Qtd</th><th>Preço c/ST</th><th>Total</th></tr></thead><tbody>'+itensP.map(i=>'<tr><td>'+(i.produtos?.codigo||'')+' '+(i.produtos?.descricao||'')+'</td><td>'+i.quantidade+'</td><td>'+fmtBRL(i.preco_unit_com_st)+'</td><td>'+fmtBRL(i.total_com_st)+'</td></tr>').join('')+'</tbody></table><div class="total-box" style="margin-top:10px"><div class="row"><span>Total sem ST:</span><span>'+fmtBRL(p.total_sem_st)+'</span></div><div class="row total"><span>Total com ST:</span><span>'+fmtBRL(p.total_com_st)+'</span></div></div>';
    const acoes=[];
    if(p.status==='PENDENTE'){acoes.push('<button class="btn btn-success btn-sm" onclick="mudarStatus(\''+id+'\',\'APROVADO\')">✔ Aprovar</button>');acoes.push('<button class="btn btn-danger btn-sm" onclick="mudarStatus(\''+id+'\',\'CANCELADO\')">✘ Cancelar</button>');}
    acoes.push('<button class="btn btn-outline btn-sm" onclick="fecharModal()">Fechar</button>');
    document.getElementById('modalAcoes').innerHTML=acoes.join('');
  }catch(e){document.getElementById('modalConteudo').innerHTML='<p style="color:red">'+e.message+'</p>';}
}
function fecharModal(){document.getElementById('modalDetalhes').classList.remove('show');}
document.getElementById('modalDetalhes').addEventListener('click',e=>{if(e.target===e.currentTarget)fecharModal();});

async function mudarStatus(id,status){
  try{await api('pedidos?id=eq.'+id,'PATCH',{status,updated_at:new Date().toISOString()});toast('Pedido '+status.toLowerCase()+'!');fecharModal();if(currentPage==='pendentes')loadPendentes();else loadHome();}
  catch(e){toast(e.message,true);}
}

async function initNovo(){
  document.getElementById('dataEmissao').value=new Date().toISOString().split('T')[0];
  itens=[];renderItens();
  if(!clientes.length){try{clientes=await api('clientes?select=id,razao_social&order=razao_social.asc&limit=500');const sel=document.getElementById('selectCliente');sel.innerHTML='<option value="">— Selecione o cliente —</option>'+clientes.map(c=>'<option value="'+c.id+'">'+c.razao_social+'</option>').join('');}catch(e){toast('Erro ao carregar clientes: '+e.message,true);}}
  if(!produtos.length){try{produtos=await api('produtos?select=id,codigo,descricao,preco_sem_st,preco_com_st&ativo=eq.true&order=descricao.asc&limit=1000');}catch(e){}}
}

function buscarProdutos(q){
  if(q.length<2){document.getElementById('resultadosProdutos').innerHTML='';return;}
  const q2=q.toLowerCase();
  const res=produtos.filter(p=>p.descricao?.toLowerCase().includes(q2)||p.codigo?.toLowerCase().includes(q2)).slice(0,8);
  document.getElementById('resultadosProdutos').innerHTML=res.length?'<div class="card" style="margin-bottom:8px">'+res.map(p=>'<div class="produto-result" onclick="addItem(\''+p.id+'\')"><div class="nome">'+p.codigo+' — '+p.descricao+'</div><div class="preco">s/ST: '+fmtBRL(p.preco_sem_st)+' | c/ST: '+fmtBRL(p.preco_com_st)+'</div></div>').join('')+'</div>':'<p style="color:#888;font-size:13px">Nenhum produto encontrado</p>';
}
function addItem(pid){const p=produtos.find(x=>x.id===pid);if(!p)return;const exist=itens.find(i=>i.produto_id===pid);if(exist)exist.quantidade++;else itens.push({produto_id:pid,produto:p,quantidade:1});document.getElementById('buscaProduto').value='';document.getElementById('resultadosProdutos').innerHTML='';renderItens();}
function removeItem(idx){itens.splice(idx,1);renderItens();}
function updateQtd(idx,v){itens[idx].quantidade=Math.max(1,parseInt(v)||1);renderItens();}
function renderItens(){
  const desc=parseFloat(document.getElementById('desconto')?.value||0)/100;
  let semST=0,comST=0;
  const html=itens.length?'<table class="itens-table" style="margin-bottom:8px"><thead><tr><th>Produto</th><th style="width:80px">Qtd</th><th>Total c/ST</th><th></th></tr></thead><tbody>'+itens.map((i,idx)=>{const tSem=i.produto.preco_sem_st*i.quantidade*(1-desc),tCom=i.produto.preco_com_st*i.quantidade*(1-desc);semST+=tSem;comST+=tCom;return'<tr><td style="font-size:12px">'+i.produto.codigo+' '+i.produto.descricao+'</td><td><input type="number" value="'+i.quantidade+'" min="1" style="padding:4px;text-align:center" onchange="updateQtd('+idx+',this.value)"></td><td style="font-weight:700">'+fmtBRL(tCom)+'</td><td><button onclick="removeItem('+idx+')" style="background:none;border:none;cursor:pointer;color:#c62828;font-size:16px">×</button></td></tr>';}).join('')+'</tbody></table>':'<p style="color:#888;font-size:13px;margin-bottom:8px">Nenhum item adicionado</p>';
  document.getElementById('itensSelecionados').innerHTML=html;
  const box=document.getElementById('totalBox');
  if(itens.length){box.style.display='block';document.getElementById('subtotalSemST').textContent=fmtBRL(semST);document.getElementById('subtotalComST').textContent=fmtBRL(comST);document.getElementById('totalFinal').textContent=fmtBRL(comST);}
  else box.style.display='none';
}
async function salvarPedido(){
  const clienteId=document.getElementById('selectCliente').value,data=document.getElementById('dataEmissao').value;
  if(!clienteId){toast('Selecione o cliente',true);return;}if(!data){toast('Informe a data',true);return;}if(!itens.length){toast('Adicione pelo menos um item',true);return;}
  const btn=document.getElementById('btnSalvar');btn.disabled=true;btn.textContent='⏳ Salvando...';
  try{
    const desc=parseFloat(document.getElementById('desconto').value||0)/100;
    let semST=0,comST=0;
    const itensSave=itens.map((i,idx)=>{const ts=i.produto.preco_sem_st*i.quantidade*(1-desc),tc=i.produto.preco_com_st*i.quantidade*(1-desc);semST+=ts;comST+=tc;return{produto_id:i.produto_id,numero_item:idx+1,quantidade:i.quantidade,preco_tabela:i.produto.preco_com_st,preco_unit_sem_st:i.produto.preco_sem_st*(1-desc),preco_unit_com_st:i.produto.preco_com_st*(1-desc),total_sem_st:ts,total_com_st:tc};});
    const [pedido]=await api('pedidos','POST',{cliente_id:clienteId,data_emissao:data,condicao_pagamento:document.getElementById('condPagamento').value,desconto_percentual:parseFloat(document.getElementById('desconto').value||0),observacoes:document.getElementById('observacoes').value,total_sem_st:semST,total_com_st:comST,status:'PENDENTE'});
    await Promise.all(itensSave.map(it=>api('itens_pedido','POST',{...it,pedido_id:pedido.id})));
    toast('✅ Pedido salvo!');itens=[];document.getElementById('observacoes').value='';document.getElementById('condPagamento').value='';document.getElementById('desconto').value='0';renderItens();
    setTimeout(()=>showPage('home'),1200);
  }catch(e){toast(e.message,true);}finally{btn.disabled=false;btn.textContent='💾 Salvar Pedido';}
}

async function loadPendentes(){
  try{
    const pedidos=await api('pedidos?status=eq.PENDENTE&select=id,numero_pedido,cliente_id,data_emissao,total_com_st,condicao_pagamento&order=data_emissao.asc');
    const ids=[...new Set(pedidos.map(p=>p.cliente_id))].filter(Boolean);let cMap={};
    if(ids.length){const cs=await api('clientes?id=in.('+ids.join(',')+')'+'&select=id,razao_social');cs.forEach(c=>cMap[c.id]=c.razao_social);}
    if(!pedidos.length){document.getElementById('listPendentes').innerHTML='<div class="empty"><div class="empty-icon">🎉</div>Nenhum pedido pendente!</div>';return;}
    document.getElementById('listPendentes').innerHTML=pedidos.map(p=>'<div class="pedido-item" onclick="verPedido(\''+p.id+'\')">'+'<div class="pedido-num">'+(p.numero_pedido||'#')+'</div><div class="pedido-info"><div class="pedido-cliente">'+(cMap[p.cliente_id]||'—')+'</div><div class="pedido-meta">'+fmtDate(p.data_emissao)+' · '+(p.condicao_pagamento||'-')+'</div></div><div class="pedido-valor">'+fmtBRL(p.total_com_st)+'</div></div>').join('');
  }catch(e){document.getElementById('listPendentes').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div>'+e.message+'</div>';}
}

async function gerarRelatorio(){
  const mes=parseInt(document.getElementById('selMes').value),ano=parseInt(document.getElementById('selAno').value);
  const ultimo=ultimoDiaMes(ano,mes);
  const di=ano+'-'+String(mes).padStart(2,'0')+'-01',df=ano+'-'+String(mes).padStart(2,'0')+'-'+String(ultimo).padStart(2,'0');
  document.getElementById('relatorioResultado').innerHTML='<div class="loading"><div class="spinner"></div>Buscando...</div>';
  try{
    const pedidos=await api('pedidos?data_emissao=gte.'+di+'&data_emissao=lte.'+df+'&select=numero_pedido,data_emissao,condicao_pagamento,total_com_st,cliente_id,status&order=data_emissao.asc&limit=500');
    const ids=[...new Set(pedidos.map(p=>p.cliente_id))].filter(Boolean);let cMap={};
    if(ids.length){const cs=await api('clientes?id=in.('+ids.join(',')+')'+'&select=id,razao_social');cs.forEach(c=>cMap[c.id]=c.razao_social);}
    const aprov=pedidos.filter(p=>p.status==='APROVADO'),canc=pedidos.filter(p=>p.status==='CANCELADO'),pend=pedidos.filter(p=>p.status==='PENDENTE');
    const tA=aprov.reduce((s,p)=>s+(p.total_com_st||0),0),tC=canc.reduce((s,p)=>s+(p.total_com_st||0),0),tP=pend.reduce((s,p)=>s+(p.total_com_st||0),0);
    if(!pedidos.length){document.getElementById('relatorioResultado').innerHTML='<div class="empty"><div class="empty-icon">📭</div>Nenhum pedido em '+MESES[mes]+'/'+ano+'</div>';return;}
    document.getElementById('relatorioResultado').innerHTML='<div class="summary-grid" style="margin-bottom:12px"><div class="summary-card green"><div class="label">Aprovados</div><div class="value" style="font-size:14px">'+fmtBRL(tA)+'</div><div style="font-size:11px;color:#888">'+aprov.length+' pedidos</div></div><div class="summary-card red"><div class="label">Cancelados</div><div class="value" style="font-size:14px">'+fmtBRL(tC)+'</div><div style="font-size:11px;color:#888">'+canc.length+' pedidos</div></div><div class="summary-card blue"><div class="label">Total Geral</div><div class="value" style="font-size:14px">'+fmtBRL(tA+tC+tP)+'</div><div style="font-size:11px;color:#888">'+pedidos.length+' pedidos</div></div></div><div style="overflow-x:auto"><table class="itens-table"><thead><tr><th>Nº Pedido</th><th>Data</th><th>Cliente</th><th>Valor c/ST</th><th>Cond. Pag.</th><th>Status</th></tr></thead><tbody>'+pedidos.map(p=>'<tr><td>'+(p.numero_pedido||'-')+'</td><td>'+fmtDate(p.data_emissao)+'</td><td style="font-size:12px">'+(cMap[p.cliente_id]||'—')+'</td><td style="font-weight:700">'+fmtBRL(p.total_com_st)+'</td><td>'+(p.condicao_pagamento||'-')+'</td><td>'+statusBadge(p.status)+'</td></tr>').join('')+'</tbody></table></div>';
  }catch(e){document.getElementById('relatorioResultado').innerHTML='<div class="empty"><div class="empty-icon">⚠️</div>'+e.message+'</div>';}
}

const now=new Date();
document.getElementById('selMes').value=now.getMonth()+1;
document.getElementById('selAno').value=now.getFullYear();
loadHome();
(async()=>{try{clientes=await api('clientes?select=id,razao_social&order=razao_social.asc&limit=500');}catch(e){}})();
(async()=>{try{produtos=await api('produtos?select=id,codigo,descricao,preco_sem_st,preco_com_st&ativo=eq.true&order=descricao.asc&limit=1000');}catch(e){}})();
</script>
